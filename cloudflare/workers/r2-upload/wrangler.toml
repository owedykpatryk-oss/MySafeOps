# Cloudflare Worker: R2 upload + authenticated/signed object fetch for MySafeOps
#
# 1. Create an R2 bucket in Cloudflare dashboard (e.g. mysafeops-files).
# 2. Replace bucket_name below.
# 3. Prefer Supabase JWT: wrangler secret put SUPABASE_URL / SUPABASE_ANON_KEY
# 3b. Durable rate limits: wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#     (calls claim_edge_rate_bucket — same Postgres buckets as Edge Functions)
# 4. Optional: wrangler secret put SIGNING_SECRET  # HMAC for GET /signed
# 5. Legacy: wrangler secret put UPLOAD_TOKEN     # only used when Supabase secrets unset
# 6. npm i -g wrangler && wrangler deploy
# 7. Set VITE_STORAGE_API_URL to the deployed worker origin (https://...workers.dev)
#
# Routes: POST /upload, GET /object?key= (JWT), GET /signed?key=&exp=&sig= (HMAC)

name = "mysafeops-r2-upload"
main = "index.mjs"
compatibility_date = "2024-09-23"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "mysafeops-files"

# Pin allowed browser origins (comma-separated). Use vercel_preview:mysafeops to allow https://mysafeops*.vercel.app previews.
[vars]
ALLOWED_ORIGINS = "https://mysafeops.com,https://www.mysafeops.com,http://localhost:5173,http://127.0.0.1:5173,vercel_preview:mysafeops"
