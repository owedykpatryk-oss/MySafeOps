# Cloudflare Worker: R2 upload endpoint for MySafeOps
#
# 1. Create an R2 bucket in Cloudflare dashboard (e.g. mysafeops-files).
# 2. Replace bucket_name below.
# 3. wrangler secret put UPLOAD_TOKEN   # legacy fallback; prefer Supabase JWT (set SUPABASE_URL + SUPABASE_ANON_KEY below)
# 4. npm i -g wrangler && wrangler deploy
# 5. Set VITE_STORAGE_API_URL to the deployed worker origin (https://...workers.dev)

name = "mysafeops-r2-upload"
main = "index.mjs"
compatibility_date = "2024-09-23"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "mysafeops-files"

# Pin allowed browser origins (comma-separated). Use vercel_preview:mysafeops to allow https://mysafeops*.vercel.app previews.
[vars]
ALLOWED_ORIGINS = "https://mysafeops.com,https://www.mysafeops.com,http://localhost:5173,http://127.0.0.1:5173,vercel_preview:mysafeops"
