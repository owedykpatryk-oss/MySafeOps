name: Cursor Sentry auto-fix

# Sentry → Settings → Integrations → Webhooks → send repository_dispatch:
#   event_type: sentry-issue
#   client_payload: { "issue_url": "https://sentry.io/...", "title": "...", "level": "error" }
on:
  repository_dispatch:
    types: [sentry-issue]
  workflow_dispatch:
    inputs:
      issue_url:
        description: "Sentry issue URL"
        required: true
        type: string

concurrency:
  group: cursor-sentry-${{ github.event.client_payload.issue_url || github.event.inputs.issue_url }}
  cancel-in-progress: false

jobs:
  trigger-cursor:
    runs-on: ubuntu-latest
    steps:
      - id: cursor-setup
        uses: ./.github/actions/cursor-setup
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

      - name: Trigger Cursor Sentry agent
        if: steps.cursor-setup.outputs.skip != 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ISSUE_URL: ${{ github.event.client_payload.issue_url || github.event.inputs.issue_url }}
          ISSUE_TITLE: ${{ github.event.client_payload.title || 'manual dispatch' }}
          ISSUE_LEVEL: ${{ github.event.client_payload.level || 'unknown' }}
        run: |
          node scripts/cursor-cloud-agent.mjs sentry \
            --skip-if-active \
            --message "Sentry alert: $ISSUE_TITLE ($ISSUE_LEVEL) — $ISSUE_URL"
