name: Cursor CI auto-fix

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: cursor-ci-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  trigger-cursor:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check CURSOR_API_KEY
        id: gate
        env:
          HAS_KEY: ${{ secrets.CURSOR_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CURSOR_API_KEY not set — skipping CI auto-fix"
          fi

      - name: Trigger Cursor cloud agent
        if: steps.gate.outputs.skip != 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          node scripts/cursor-cloud-agent.mjs ci-fix \
            --ref "$CI_BRANCH" \
            --run-url "$CI_RUN_URL" \
            --message "Event: $CI_EVENT | Branch: $CI_BRANCH | SHA: $CI_SHA"
