name: Cursor billing auto-fix

on:
  workflow_run:
    workflows: ["Billing Smoke"]
    types: [completed]

concurrency:
  group: cursor-billing-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  trigger-cursor:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'fix/billing-') &&
      !startsWith(github.event.workflow_run.head_branch, 'fix/ci-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - id: cursor-setup
        uses: ./.github/actions/cursor-setup
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

      - name: Trigger Cursor billing agent
        if: steps.cursor-setup.outputs.skip != 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          node scripts/cursor-workflow-trigger.mjs billing \
            --run-url "$CI_RUN_URL" \
            --ref "$CI_BRANCH" \
            --branch "$CI_BRANCH" \
            --sha "$CI_SHA"
