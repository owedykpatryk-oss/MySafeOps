name: CI

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: npm audit
        run: npm run audit:ci
      - name: Security doctor
        run: npm run security:doctor

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Hooks JSX guard
        run: npm run check:hooks-jsx
      - name: Survey docs guard
        run: npm run check:survey-docs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium
      - name: E2E public invite pages
        run: npx playwright test tests/e2e/public-pages.spec.js
      - name: E2E marketing + public auth (no secrets)
        run: >
          npx playwright test
          tests/e2e/blog.spec.js
          tests/e2e/landing.spec.js
          tests/e2e/security.spec.js
          tests/e2e/auth.spec.js
          --grep "sanitizes malicious next=|preserves safe next=|reset password page"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Production build
        run: |
          npm run build 2>&1 | tee build-output.txt
          node scripts/check-vite-circular-chunks.mjs build-output.txt
